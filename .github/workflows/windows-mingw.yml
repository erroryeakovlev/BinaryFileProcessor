name: Windows MinGW Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          archives: 'qtbase'
          tools: 'tools_mingw1310'
          cache: true

      - name: Verify environment
        shell: pwsh
        run: |
          qmake --version
          g++ --version
          cmake --version

      - name: Configure
        shell: pwsh
        run: |
          qt-cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --parallel 2

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: BinaryFileProcessor-Windows
          path: build/BinaryFileProcessor.exe
     
      - name: Deploy Qt dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deploy
          Copy-Item build/BinaryFileProcessor.exe deploy/
          windeployqt --release --compiler-runtime deploy/BinaryFileProcessor.exe

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: BinaryFileProcessor-Windows
          path: deploy/ 
